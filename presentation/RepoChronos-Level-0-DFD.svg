<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="3900" viewBox="0 0 4000 3900"><title>RepoChronos Level 0 Data Flow Diagram</title><defs><marker id="arrow" markerWidth="18" markerHeight="16" refX="17" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 8 L0 16 Z" fill="#434B53"/></marker></defs><rect width="4000" height="3900" fill="#FFFFFF"/><text x="100" y="137.44" font-family="Arial" font-size="66" font-weight="400" fill="#205946" text-anchor="start"><tspan x="100" dy="0">Level 0 DFD (Context Diagram)</tspan></text><text x="100" y="246.56" font-family="Arial" font-size="34" font-weight="700" fill="#25323D" text-anchor="start"><tspan x="100" dy="0">RepoChronos as one process, with its users and the external GitHub REST API.</tspan></text><rect x="140" y="650" width="500" height="2200" fill="#FFF2BD" stroke="#434B53" stroke-width="3"/><text x="390" y="1622.98" font-family="Arial" font-size="49" font-weight="700" fill="#25323D" text-anchor="middle"><tspan x="390" dy="0">Repository user</tspan><tspan x="390" dy="56.839999999999996"></tspan><tspan x="390" dy="56.839999999999996">Owner</tspan><tspan x="390" dy="56.839999999999996">Editor</tspan><tspan x="390" dy="56.839999999999996">Viewer</tspan></text><ellipse cx="2250" cy="1750" rx="600" ry="1200" fill="#FFD5D2" stroke="#434B53" stroke-width="3"/><text x="2250" y="1529.04" font-family="Arial" font-size="64" font-weight="700" fill="#25323D" text-anchor="middle"><tspan x="2250" dy="0">0</tspan><tspan x="2250" dy="74.24"></tspan><tspan x="2250" dy="74.24">RepoChronos</tspan><tspan x="2250" dy="74.24"></tspan><tspan x="2250" dy="74.24">Repository Health</tspan><tspan x="2250" dy="74.24">and Code Quality</tspan><tspan x="2250" dy="74.24">Tracking System</tspan></text><rect x="3300" y="1500" width="550" height="550" fill="#FFF2BD" stroke="#434B53" stroke-width="3"/><text x="3575" y="1757.28" font-family="Arial" font-size="53" font-weight="700" fill="#25323D" text-anchor="middle"><tspan x="3575" dy="0">GitHub</tspan><tspan x="3575" dy="61.48">REST API</tspan></text><line x1="640" y1="900" x2="1826.4731413475647" y2="900" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="833.32" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">Account / login details;</tspan><tspan x="1160" dy="37.12">membership changes</tspan></text><line x1="1654.705955010467" y1="1900" x2="640" y2="1900" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="1833.3200000000002" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">Authentication, access and</tspan><tspan x="1160" dy="37.12">membership results</tspan></text><line x1="640" y1="1100" x2="1745.6439749541996" y2="1100" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="1033.3200000000002" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">GitHub repository URL;</tspan><tspan x="1160" dy="37.12">import request</tspan></text><line x1="1676.0879858375501" y1="2100" x2="640" y2="2100" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="2051.88" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">Connection and import results</tspan></text><line x1="640" y1="1300" x2="1693.7851134678253" y2="1300" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="1251.88" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">Analysis request</tspan></text><line x1="1716.7317748074615" y1="2300" x2="640" y2="2300" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="2233.32" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">Complexity results and</tspan><tspan x="1160" dy="37.12">file coverage</tspan></text><line x1="640" y1="1500" x2="1663.165270284725" y2="1500" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="1433.3200000000002" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">Bug report; assignee; status;</tspan><tspan x="1160" dy="37.12">fixing commit</tspan></text><line x1="1781.62515012012" y1="2500" x2="640" y2="2500" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="2433.32" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">Bug status and</tspan><tspan x="1160" dy="37.12">resolution history</tspan></text><line x1="640" y1="1700" x2="1650.52105958591" y2="1700" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="1633.3200000000002" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">History, comparison and</tspan><tspan x="1160" dy="37.12">dashboard requests</tspan></text><line x1="1883.4280425346205" y1="2700" x2="640" y2="2700" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="1160" y="2633.32" font-family="Arial" font-size="32" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="1160" dy="0">History, contributions,</tspan><tspan x="1160" dy="37.12">comparisons and trends</tspan></text><line x1="2846.992462263972" y1="1630" x2="3300" y2="1630" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="3072.5" y="1533.04" font-family="Arial" font-size="28" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="3072.5" dy="0">Repository / commit</tspan><tspan x="3072.5" dy="32.48">and source-blob</tspan><tspan x="3072.5" dy="32.48">queries</tspan></text><line x1="3300" y1="1900" x2="2845.294044989533" y2="1900" stroke="#434B53" stroke-width="3" marker-end="url(#arrow)"/><text x="3072.5" y="1957.04" font-family="Arial" font-size="28" font-weight="400" fill="#25323D" text-anchor="middle"><tspan x="3072.5" dy="0">Repository / commit</tspan><tspan x="3072.5" dy="32.48">records and</tspan><tspan x="3072.5" dy="32.48">source blobs</tspan></text><text x="140" y="3151.9" font-family="Arial" font-size="35" font-weight="700" fill="#205946" text-anchor="start"><tspan x="140" dy="0">SYSTEM BOUNDARY</tspan></text><text x="140" y="3256.84" font-family="Arial" font-size="34" font-weight="400" fill="#25323D" text-anchor="start"><tspan x="140" dy="0">Laravel, Python Lizard and Supabase PostgreSQL belong inside process 0.</tspan><tspan x="140" dy="39.44">Data stores and internal operations appear in the Level 1 decomposition.</tspan></text><text x="140" y="3497.56" font-family="Arial" font-size="31" font-weight="400" fill="#586674" text-anchor="start"><tspan x="140" dy="0">Access depends on the repository role. Owners manage membership. Owners and editors import, analyze and update bugs.</tspan><tspan x="140" dy="35.96">Viewers read authorized repository data. Any authenticated user may connect an accessible new repository.</tspan></text><text x="140" y="3762.7" font-family="Arial" font-size="30" font-weight="400" fill="#586674" text-anchor="start"><tspan x="140" dy="0">Rectangles = external entities     Ellipse = system process     Labeled arrows = data flows</tspan></text></svg>