329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">Register account</tspan></text><ellipse cx="1380" cy="490" rx="380" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="1380" y="501.56" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">Log in</tspan></text><ellipse cx="1380" cy="650" rx="380" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="1380" y="661.56" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">Log out</tspan></text><ellipse cx="1380" cy="810" rx="380" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="1380" y="821.56" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">Connect a GitHub repository</tspan></text><ellipse cx="1380" cy="1020" rx="380" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="1380" y="1031.56" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">View commit and file history</tspan></text><ellipse cx="1380" cy="1180" rx="380" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="1380" y="1191.56" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">View developer contributions</tspan></text><ellipse cx="1380" cy="1340" rx="380" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="1380" y="1351.56" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">View measurements and file coverage</tspan></text><ellipse cx="1380" cy="1500" rx="380" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="1380" y="1511.56" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="1380" dy="0">Compare