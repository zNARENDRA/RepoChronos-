ext><ellipse cx="2640" cy="2620" rx="350" ry="60" fill="#DFEFCF" stroke="#7A9A65" stroke-width="3"/><text x="2640" y="2611.67" fill="#263329" font-family="Arial" font-size="34" font-weight="400" text-anchor="middle"><tspan x="2640" dy="0">Fetch missing source</tspan><tspan x="2640" dy="39.78">from GitHub</tspan></text><ellipse cx="400" cy="475" rx="30" ry="30" fill="#F9C8CB" stroke="#343B37" stroke-width="3"/><line x1="400" y1="505" x2="400" y2="640" stroke="#343B37" stroke-width="3" /><line x1="340" y1="570" x2="460" y2="570" stroke="#343B37" stroke-width="3" /><line x1="400" y1="640" x2="355" y2="710" stroke="#343B37" stroke-width="3" /><line x1="400" y1="640" x2="445" y2="710" stroke="#343B37" stroke-width="3" /><text x="180" y="583.94" fill="#263329" font-family="Arial" font-size="41" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">User</tspan></text><ellipse cx="400" cy="1405" rx="30" ry="30" fill="#F9C8CB" stroke="#343B37" stroke-width="3"/><line x1="400" y1="1435" x2="400" y2="1570" stroke="#343B37" stroke-width="3" /><line x1="340" y1="1500" x2="460" y2="1500" stroke="#343B37" stroke-width="3" /><line x1="400" y1="1570" x2="355" y2="1640" stroke="#343B37" stroke-width="3" /><line x1="400" y1="1570" x2="445" y2="1640" stroke="#343B37" stroke-width="3" /><text x="180" y="1513.94" fill="#263329" font-family="Arial" font-size="41" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">Viewer</tspan></text><ellipse cx="400" cy="2620" rx="30" ry="30" fill="#F9C8CB" stroke="#343B37" stroke-width="3"/><line x1="400" y1="2650" x2="400" y2="2785" stroke="#343B37" stroke-width="3" /><line x1="340" y1="2715" x2="460" y2="2715" stroke="#343B37" stroke-width="3" /><line x1="400" y1="2785" x2="355" y2="2855" stroke="#343B37" stroke-width="3" /><line x1="400" y1="2785" x2="445" y2="2855" stroke="#343B37" stroke-width="3" /><text x="180" y="2728.94" fill="#263329" font-family="Arial" font-size="41" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">Editor</tspan></text><ellipse cx="400" cy="3405" rx="30" ry="30" fill="#F9C8CB" stroke="#343B37" stroke-width="3"/><line x1="400" y1="3435" x2="400" y2="3570" stroke="#343B37" stroke-width="3" /><line x1="340" y1="3500" x2="460" y2="3500" stroke="#343B37" stroke-width="3" /><line x1="400" y1="3570" x2="355" y2="3640" stroke="#343B37" stroke-width="3" /><line x1="400" y1="3570" x2="445" y2="3640" stroke="#343B37" stroke-width="3" /><text x="180" y="3513.94" fill="#263329" font-family="Arial" font-size="41" font-weight="700" text-anchor="middle"><tspan x="180" dy="0">Owner</tspan></text><ellipse cx="3700" cy="1805" rx="30" ry="30" fill="#F9C8CB" stroke="#343B37" stroke-width="3"/><line x1="3700" y1="1835" x2="3700" y2="1970" stroke="#343B37" stroke-width="3" /><line x1="3640" y1="1900" x2="3760" y2="1900" stroke="#343B37" stroke-width="3" /><line x1="3700" y1="1970" x2="3655" y2="2040" stroke="#343B37" stroke-width="3" /><line x1="3700" y1="1970" x2="3745" y2="2040" stroke="#343B37" stroke-width="3" /><text x="3870" y="1875.1000000000001" fill="#263329" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle"><tspan x="3870" dy="0">«system»</tspan><tspan x="3870" dy="35.099999999999994">GitHub</tspan><tspan x="3870" dy="35.099999999999994">REST API</tspan></text><text x="90" y="3758.52" fill="#596959" font-family="Arial" font-size="28" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Viewer inherits User. Editor inherits Viewer. Owner inherits Editor. Repository roles apply to the selected repository.</tspan></text><text x="90" y="3829.18" fill="#596959" font-family="Arial" font-size="27" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Repository actions require login. «include» = required sub-action. «extend» = conditional behavior. Hollow triangle points to the parent actor.</tspan></text></svg>